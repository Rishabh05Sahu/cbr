# Production deploy on every push to main (owner request 2026-11-18): build the images for the
# commit (release.yml), then run deploy/aws/deploy.sh on the server through AWS Systems Manager
# Run Command (no SSH: the owner's changing home IP does not matter), then check the live site.
#
# Safety:
# - Database migrations stay manual and interactive (migrate-supabase.mjs --target prod). If the
#   commits since the running version add a migration, the deploy STOPS before touching the
#   server. Apply it, then re-run this workflow by hand with "migrations_applied" ticked.
# - Rollback: run this workflow by hand on an older commit of main, or deploy.sh <old sha>.
#
# AWS access is short-lived via GitHub OIDC (role AWS_RELEASE_ROLE_ARN, main and qa only).
# Repository variables: AWS_RELEASE_ROLE_ARN, ECR_REGISTRY, PROD_SUPABASE_URL (release.yml) and
#   PROD_INSTANCE_ID   the EC2 instance id of cbr-prod (i-…)
#   PROD_SITE_URL      https://crm.crystalbricksroofs.com
name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: New migrations in this deploy are already applied to production
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No `environment:` here: it would change the OIDC subject to …:environment:<name>, which the
    # role's trust policy (branch-based) refuses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: AWS credentials (OIDC, 1 hour)
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity --region ap-south-1 \
            --role-arn "$ROLE_ARN" --role-session-name "deploy-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" --duration-seconds 3600 --query Credentials --output json)
          for k in AccessKeyId:AWS_ACCESS_KEY_ID SecretAccessKey:AWS_SECRET_ACCESS_KEY SessionToken:AWS_SESSION_TOKEN; do
            v=$(jq -r ".${k%%:*}" <<<"$creds"); echo "::add-mask::$v"; echo "${k##*:}=$v" >> "$GITHUB_ENV"
          done
          echo "AWS_REGION=ap-south-1" >> "$GITHUB_ENV"

      - name: Helper to run a command on the server (SSM Run Command)
        env:
          INSTANCE: ${{ vars.PROD_INSTANCE_ID }}
        run: |
          INSTANCE=$(tr -d '[:space:]' <<<"$INSTANCE")   # pasted values often carry a stray space
          [[ $INSTANCE =~ ^i-[0-9a-f]{8,17}$ ]] || {
            echo "::error::repository variable PROD_INSTANCE_ID must be i- plus 8-17 lowercase hex characters (got ${#INSTANCE} characters)"; exit 1; }
          cat > "$RUNNER_TEMP/on-server" <<'SH'
          #!/usr/bin/env bash
          # Usage: on-server "<shell command>"  → prints its output; fails if the command failed.
          set -euo pipefail
          params=$(jq -nc --arg c "$1" '{commands: [$c], executionTimeout: ["900"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy-prod ${GITHUB_RUN_ID}" --parameters "$params" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          [[ $status == Success ]] || { echo "::error::server command ended with status $status"; exit 1; }
          SH
          chmod +x "$RUNNER_TEMP/on-server"
          echo "INSTANCE=$INSTANCE" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Refuse unapplied migrations
        env:
          CONFIRMED: ${{ inputs.migrations_applied }}
        run: |
          running=$(on-server 'cat /opt/crm/current-tag' | grep -oE '^[0-9a-f]{40}' | head -1 || true)
          echo "server runs: ${running:-unknown}"
          if [[ -z $running ]] || ! git cat-file -e "$running^{commit}" 2>/dev/null; then
            new=$(ls prisma/migrations | grep -E '^[0-9]{4}_' | tail -1)
            echo "running version not in history; newest migration in this commit: $new"
            [[ $CONFIRMED == true ]] || { echo "::error::cannot tell which migrations are new; apply them, then re-run by hand with migrations_applied"; exit 1; }
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$running" "$GITHUB_SHA" -- 'prisma/migrations/*/migration.sql')
          if [[ -n $added && $CONFIRMED != true ]]; then
            echo "::error::new migrations since the running version: $(echo $added | tr '\n' ' ')"
            echo "Apply them first:  node scripts/db/migrate-supabase.mjs --target prod --deploy"
            echo "then Actions → deploy-prod → Run workflow (main) with \"migrations_applied\" ticked."
            exit 1
          fi
          echo "no new migrations${added:+ (confirmed applied)}"

      - name: Deploy on the server
        run: on-server "runuser -l ubuntu -c 'bash /opt/crm/deploy.sh $GITHUB_SHA'"

      - name: Check the live site
        env:
          SITE: ${{ vars.PROD_SITE_URL }}
        run: |
          SITE=$(tr -d '[:space:]' <<<"$SITE"); SITE=${SITE%/}
          for _ in $(seq 1 20); do
            body=$(curl -fsS --max-time 10 "$SITE/api/health" || true)
            [[ $body == *'"ok"'* ]] && { echo "healthy: $body"; echo "Deployed $GITHUB_SHA to $SITE" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 6
          done
          echo "::error::$SITE/api/health is not healthy"; exit 1
