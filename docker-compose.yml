# Local development services only. Not used for staging or production.
# Ports are offset (5xxxx) to avoid clashing with other local projects.
name: cbr-crm

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      CRM_MIGRATOR_PASSWORD: ${CRM_MIGRATOR_PASSWORD:?set in .env}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?set in .env}
      CRM_PLATFORM_PASSWORD: ${CRM_PLATFORM_PASSWORD:?set in .env}
      CRM_AUTH_PASSWORD: ${CRM_AUTH_PASSWORD:?set in .env}
      # Optional so existing .env files keep working; without it crm_cleanup is not created.
      CRM_CLEANUP_PASSWORD: ${CRM_CLEANUP_PASSWORD:-}
    command:
      ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'max_connections=200']
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts/db/provision-cleanup-role.sql:/crm-sql/provision-cleanup-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0.6-alpine
    # BullMQ requires noeviction (ADR-0005).
    command: ['valkey-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:51025:1025' # SMTP
      - '127.0.0.1:54025:8025' # web UI / API
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  valkeydata:
